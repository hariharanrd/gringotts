name: Unified Deployment Workflow

on:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
            client:
              - 'client/**'
            db:
              - 'supabase/migrations/**'

  db-push:
    name: Push Database Migrations
    needs: changes
    if: ${{ needs.changes.outputs.db == 'true' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link Project
        run: supabase link --project-ref $PROJECT_ID

      - name: Run Supabase DB Push
        run: supabase db push

  deploy-backend:
    name: Deploy Backend to Cloud Run
    needs: [changes, db-push]
    if: ${{ always() && needs.changes.result == 'success' && (needs.db-push.result == 'success' || needs.db-push.result == 'skipped') && needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
      deployments: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Configure Docker'
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: 'Build and Push Container'
        run: |
          IMAGE_NAME="asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gringotts/server:${{ github.sha }}"
          docker build -t "$IMAGE_NAME" ./server
          docker push "$IMAGE_NAME"

      - name: 'Deploy to Cloud Run'
        id: deploy
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: 'gringotts-server'
          image: "asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gringotts/server:${{ github.sha }}"
          region: 'asia-south1'
          flags: '--allow-unauthenticated'

      - name: 'Show Output'
        run: echo ${{ steps.deploy.outputs.url }}

  deploy-frontend:
    name: Deploy Frontend to Firebase
    needs: [changes, db-push, deploy-backend]
    if: ${{ always() && needs.changes.result == 'success' && (needs.db-push.result == 'success' || needs.db-push.result == 'skipped') && needs.changes.outputs.client == 'true' && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      deployments: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci
        working-directory: ./client

      - name: Build project
        run: |
          npm run build
          echo '{"sha":"${{ github.sha }}","run_id":"${{ github.run_id }}","run_attempt":"${{ github.run_attempt }}"}' > dist/deploy-info.json
        working-directory: ./client

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        continue-on-error: true
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GRINGOTTS_491511 }}
          channelId: live
          projectId: gringotts-491511
          entryPoint: ./client
