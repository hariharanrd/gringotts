name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    paths:
      - 'client/**'
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
            client:
              - 'client/**'

  build_and_preview:
    needs: changes
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.client == 'true' && needs.changes.outputs.server == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm ci
        working-directory: ./client
      - name: Build project
        run: npm run build
        working-directory: ./client
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GRINGOTTS_491511 }}
          projectId: gringotts-491511
          entryPoint: ./client
