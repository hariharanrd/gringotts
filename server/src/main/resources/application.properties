spring.application.name=Gringotts
spring.profiles.active=dev

server.port=8080
jwt.expiration=604800000
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Settings
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cache Settings
spring.cache.cache-names=users,categories,subCategories,items,categoryById,subCategoryById,itemById
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60m

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2

# Mailgun Settings
mailgun.api-key=key-placeholder
mailgun.domain=sandbox-placeholder.mailgun.org
mailgun.from-email=Gringotts Recovery <noreply@sandbox-placeholder.mailgun.org>

# Client Settings
client.base-url=http://localhost:5173

# AI Model Settings
ai.provider=${AI_PROVIDER}
ai.local.url=${AI_LOCAL_URL}
ai.local.model=${AI_LOCAL_MODEL}

# Gemini AI Settings
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-3.6-flash
gemini.api-url=https://generativelanguage.googleapis.com/v1beta/interactions