<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <!-- Neon Glow Gradients -->
    <radialGradient id="cyan-glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violet-glow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shape-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="shape-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.01" />
    </linearGradient>
  </defs>

  <!-- Solid base -->
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Ambient Glows -->
  <rect width="100%" height="100%" fill="url(#cyan-glow)" />
  <rect width="100%" height="100%" fill="url(#violet-glow)" />

  <!-- Floating Abstract Glassy Wave Shapes -->
  <path d="M-100,100 C150,50 300,200 550,80 C700,20 850,150 950,100 L950,350 L-100,350 Z" fill="url(#shape-grad-1)" />
  <path d="M-50,220 C200,140 400,260 600,160 C750,80 850,240 900,200 L900,350 L-50,350 Z" fill="url(#shape-grad-2)" />

  <!-- Fine futuristic grid overlay -->
  <g stroke="rgba(255, 255, 255, 0.015)" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="450" y1="0" x2="450" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
  </g>
</svg>
